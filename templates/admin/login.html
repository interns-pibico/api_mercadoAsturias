<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso — Mercado Asturias</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, sans-serif;
            background: #0f0f1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrap {
            width: 100%;
            max-width: 400px;
            padding: 1rem;
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: .5rem;
        }
        .logo h1 {
            color: white;
            font-size: 1.3rem;
            font-weight: 600;
        }
        .logo p {
            color: #888;
            font-size: .85rem;
            margin-top: .25rem;
        }

        .card {
            background: #1a1a2e;
            border: 1px solid #2a2a3e;
            border-radius: 12px;
            padding: 2rem;
        }

        .field {
            margin-bottom: 1.2rem;
        }
        .field label {
            display: block;
            color: #aaa;
            font-size: .85rem;
            margin-bottom: .4rem;
            font-weight: 500;
        }
        .field input {
            width: 100%;
            padding: .7rem 1rem;
            background: #0f0f1a;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            color: white;
            font-size: .95rem;
            font-family: inherit;
            transition: border-color .15s;
        }
        .field input:focus {
            outline: none;
            border-color: #a8d8ea;
        }
        .field input::placeholder { color: #555; }

        .btn-submit {
            width: 100%;
            padding: .8rem;
            background: #a8d8ea;
            color: #0f0f1a;
            border: none;
            border-radius: 8px;
            font-size: .95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background .15s;
            margin-top: .5rem;
        }
        .btn-submit:hover { background: #8ecde3; }

        .error {
            background: #3b1212;
            border: 1px solid #7d1d1d;
            color: #fca5a5;
            border-radius: 8px;
            padding: .7rem 1rem;
            font-size: .85rem;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: .5rem;
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="logo">
            <span class="icon">🛒</span>
            <h1>Mercado Asturias</h1>
            <p>Panel de administración</p>
        </div>

        <div class="card">
            {% if error %}
            <div class="error">
                <span>⚠️</span> {{ error }}
            </div>
            {% endif %}

            <form method="post" action="{{ prefix }}/admin/login">
                <div class="field">
                    <label for="username">Usuario</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="admin"
                        autocomplete="username"
                        required
                    >
                </div>
                <div class="field">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >
                </div>
                <button type="submit" class="btn-submit">Entrar</button>
            </form>
        </div>
    </div>
</body>
</html>
