# api_mercadoAsturias — Referencia nginx
# Upstream (incluir en app_example.conf junto al resto de upstreams)

upstream api_mercadoAsturias_backend {
    server 127.0.0.1:8001 fail_timeout=0;
}

# --- Locations (incluir en /etc/nginx/conf.d/locations/mercadoAsturias.conf) ---

# Redirect sin trailing slash
location = /mercado {
    return 301 /mercado/;
}

# Redirect raíz → login del admin
location = /mercado/ {
    return 302 /mercado/admin/login;
}

# Archivos estáticos de api_mercadoAsturias (servidos directamente por Nginx)
location /mercado/static/ {
    alias /home/erpnext/.services/api_mercadoAsturias/app/static/;
    expires 7d;
    add_header Cache-Control "public, immutable";
}

# Proxy de todo /mercado/ al backend (elimina el prefijo)
location /mercado/ {
    proxy_pass http://api_mercadoAsturias_backend/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /mercado;
    proxy_connect_timeout 30s;
    proxy_read_timeout 60s;
}
